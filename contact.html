<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact – AMELTAN</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #509C6F;
      margin: 0;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .logo, .mlscn {
      width: 150px;
      border-radius: 100px;
      margin-bottom: 20px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ameltan-aks {
      font-size: 30px;
      color: #222;
      margin-top: 10px;
    }

    .hamburger {
      font-size: 40px;
      cursor: pointer;
    }

    #menu.hidden {
      display: none;
    }

    #menu {
      position: sticky;
      top: 0;
      background-color: #819b8b;
      z-index: 1000;
      padding: 10px;
    }

    #menu ul {
      list-style: none;
      padding: 0;
    }

    #menu li {
      margin: 10px 0;
    }

    #menu a {
      text-decoration: none;
      color: blue;
      font-size: 20px;
    }

    #menu a:hover {
      color: #f3f3f3;
    }

    .contact-title {
      font-size: 40px;
      color: antiquewhite;
      text-align: center;
      margin-top: 30px;
    }

    .contact-info, .contact-form {
      background-color: whitesmoke;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 18px;
      color: #333;
    }

    label {
      display: block;
      margin-top: 15px;
      font-size: 18px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 20px;
      padding: 10px;
      width: 100%;
      background-color: #3C94BC;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 18px;
      border-radius: 8px;
    }
    #menu a {
  text-decoration: none;
  color: blue;
  font-size: 20px;
  position: relative;
  transition: color 0.3s ease, transform 0.3s ease;
}

#menu a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -2px;
  width: 0%;
  height: 2px;
  background-color: #f3f3f3;
  transition: width 0.3s ease;
}

#menu a:hover {
  color: #f3f3f3;
  transform: translateX(5px); /* subtle slide effect */
}

#menu a:hover::after {
  width: 100%; /* underline grows smoothly */
}
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <img class="logo" src="ameltan.jpg" alt="AMELTAN Logo">
    <img class="mlscn" src="mlscn.png" alt="MLSCN Logo">
  </div>

  <h1 class="ameltan-aks">
    Association of Medical Laboratory Technician and Assistant Nigeria – Akwa Ibom State
  </h1>

  <div class="hamburger" onclick="toggleMenu()">☰</div>
  <nav id="menu" class="hidden">
    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="aboutUs.html">About Us</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="register.html">Registration</a></li>
    </ul>
  </nav>
</header>

<h2 class="contact-title">Contact Us</h2>

<section class="contact-info">
  <p><strong>Email:</strong> <a href="mailto:ameltanaks.org.gmail.com">ameltanaks.org.gmail.com</a></p>
  <p><strong>Phone:</strong> 08067488551</p>
</section>

<section class="contact-form">
  <form>
    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" placeholder="Your full name" required>

    <label for="email">Email Address:</label>
    <input type="email" id="email" placeholder="Your email" required>

    <label for="message">Message:</label>
    <textarea id="message" rows="5" placeholder="Type your message here..." required></textarea>

    <button type="submit">Send Message</button>
  </form>
</section>

<script>
  function toggleMenu() {
    const menu = document.getElementById("menu");
    menu.classList.toggle("hidden");
  }
</script>

</body>
</html>
